name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PadTools.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: cd PadTools && gradle assembleDebug --no-daemon
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp PadTools/app/build/outputs/apk/debug/app-debug.apk PadTools.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PadTools.apk --target "$GITHUB_SHA" --title "PadTools" --notes "Pobierz PadTools.apk i zainstaluj."
